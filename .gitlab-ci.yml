# Yaqeen AI CI — install, lint, type-check, test, build.
# No production deploy stage yet.

stages:
  - install
  - lint
  - type-check
  - test
  - build

variables:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Do not upload node_modules as job artifacts — GitLab rejects that as 413.
.pnpm_cache_key: &pnpm_cache_key
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm
    - node_modules
    - apps/web/node_modules
    - packages/shared/node_modules

.node_base:
  image: node:${NODE_VERSION}-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir $PNPM_HOME
    - pnpm install --frozen-lockfile

.python_base:
  image: python:${PYTHON_VERSION}-bookworm
  before_script:
    - cd apps/api
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

# ---------------------------------------------------------------------------
# Install
# ---------------------------------------------------------------------------
install:node:
  extends: .node_base
  stage: install
  cache:
    <<: *pnpm_cache_key
    policy: pull-push
  script:
    - echo "Dependencies installed"

install:python:
  extends: .python_base
  stage: install
  cache:
    key: pip-${PYTHON_VERSION}
    paths:
      - .cache/pip
  script:
    - python -c "import fastapi; print(fastapi.__version__)"

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
lint:node:
  extends: .node_base
  stage: lint
  cache:
    <<: *pnpm_cache_key
    policy: pull
  needs: ["install:node"]
  script:
    - pnpm lint
    - pnpm format:check

lint:python:
  extends: .python_base
  stage: lint
  needs: ["install:python"]
  script:
    - ruff check .
    - ruff format --check .

# ---------------------------------------------------------------------------
# Type-check
# ---------------------------------------------------------------------------
typecheck:node:
  extends: .node_base
  stage: type-check
  cache:
    <<: *pnpm_cache_key
    policy: pull
  needs: ["install:node"]
  script:
    - pnpm typecheck

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test:node:
  extends: .node_base
  stage: test
  cache:
    <<: *pnpm_cache_key
    policy: pull
  needs: ["install:node"]
  script:
    - pnpm test

test:python:
  extends: .python_base
  stage: test
  needs: ["install:python"]
  script:
    - python -m pytest -q

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
build:web:
  extends: .node_base
  stage: build
  cache:
    <<: *pnpm_cache_key
    policy: pull
  needs: ["install:node"]
  script:
    - pnpm build
